# Number of simulations
simulations: 100

# Player algorithms: random, mcts_vanilla, mcts_rave
player1_alg: "random"
player2_alg: "mcts_vanilla"

# MCTS parameters
sample_size: -1            # x = -1: no sampling, x > 0: sample x moves
sample_weights: [1, 1, 1] # [buy_card, reserve_card, collect_tokens]
time_limit: True          # True = mcts_budget is time limit in seconds for search phase, False = mcts_budget is number of rollouts for search phase
mcts_budget: 0.3          # Search phase budget (based on 'time' setting) x = -1: explore every move once (for mcts), x > 0: explore x moves

# Rave parameters
ignore_move_details: False  # True = ignore returned tokens and payments (i.e. only cares if a card if bought, for example, ignoring which combination of tokens was used), False = don't ignore

# General simulations settings
reduced: True            # whether to reduce the payment combinations (i.e. can yellow tokens be used any time (reduced=False), or only when a card cannot be bought without them (reduced=True))
logs: True
